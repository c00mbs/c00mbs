<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 64" width="140" height="64" role="img" aria-label="BEECOME bumblebee">
  <!-- dashed buzz trail -->
  <path d="M6 40 H62" fill="none" stroke="#c89b3c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <!-- wings -->
  <ellipse cx="98" cy="18" rx="14" ry="8" fill="#ffffff" stroke="#141414" stroke-width="2.2" opacity="0.95" transform="rotate(-28 98 18)"/>
  <ellipse cx="114" cy="20" rx="12" ry="7" fill="#ffffff" stroke="#141414" stroke-width="2.2" opacity="0.95" transform="rotate(-12 114 20)"/>
  <!-- body -->
  <ellipse cx="102" cy="38" rx="26" ry="18" fill="#c89b3c"/>
  <clipPath id="bodyClip">
    <ellipse cx="102" cy="38" rx="26" ry="18"/>
  </clipPath>
  <g clip-path="url(#bodyClip)">
    <rect x="92" y="18" width="7" height="40" fill="#141414"/>
    <rect x="106" y="18" width="7" height="40" fill="#141414"/>
  </g>
  <!-- head -->
  <circle cx="126" cy="36" r="8" fill="#141414"/>
  <circle cx="129" cy="33" r="2" fill="#ffffff"/>
  <!-- antennae -->
  <path d="M124 28 Q122 20 116 18" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M128 28 Q130 20 136 18" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round"/>
  <!-- stinger -->
  <path d="M76 38 L68 42 L76 46 Z" fill="#141414"/>
</svg>
